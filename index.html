<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Jackson Electronics</title>
        <link rel="stylesheet" href="thuoctinh.css">
    </head>
    <body>
        <table align="center" width="50%" style="background-color: #8EC5FC; margin:0 auto">
            <tr>
                <td align="center">
                <div class="logo">
                    <h1>Jackson</h1>
                    <hr style="border: none; border-top: 3px solid black; margin: 2px 0">
                    <h1>Electronics</h1>
                </div>
                <h2 class="odau1">Registration Form</h2>
                <p class="odau2">Register your Jackson Electronics product here</p>
                <form>
                    <table cellpadding="3" class="luidaudong" style="margin-top:0">
                        <tr>
                            <td width="40%"><label>First Name:</label></td>
                            <td colspan="2">
                            <input type="text" style="width:120px">
                            <label>Last Name:</label>
                            <input type="text" style="width:120px">
                            </td>
                        </tr>
                        <tr>
                            <td ><label>Address #1:</label></td>
                            <td colspan="2"><input type="text" class="dai"></td>
                        </tr>
                        <tr>
                            <td><label>Address #2:</label></td>
                            <td colspan="2"><input type="text" class="dai"></td>
                        </tr>
                        <tr>
                            <td><label>City:</label></td>
                            <td colspan="2">
                                <input type="text" class="trung">
                                <label>State:</label>
                                <input type="text" class="nho">
                                <label style="margin-left: 4px;">Zip:</label>
                                <input type="text" style="width:70px">
                            </td>
                        </tr>
                        <tr>
                            <td><label>Country:</label></td>
                            <td colspan="2"><input type="text" class="trung" value="United States"></td>
                        </tr>
                        <tr>
                            <td colspan="3"><hr style="border: none; border-top: 1px solid black; width: 95%; margin-left:0;"></td>
                        </tr>
                        <tr>
                            <td><label>Product:</label></td>
                            <td colspan="2">
                                <select name="Product" style="width:120px">
                                    <option value="1">ScanMaster</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label>Date Purchased:</label></td>
                            <td colspan="2"><input type="text" class="trung"></td>
                        </tr>
                        <tr>
                            <td><label>Serial #:</label></td>
                            <td colspan="2"><input type="text" class="trung"></td>
                        </tr>
                        <tr>
                            <td valign="top" style="padding-top: 3px;"><label>Used for:</label></td>
                            <td width="140px">
                                <input type="radio" id="1" name="User">
                                <label for="1">Home</label>
                            </td>
                            <td>
                                <input type="radio" id="2" name="User">
                                <label for="2">Educational Institution</label>
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="radio" id="3" name="User" value="Business" checked>
                                <label for="3">Business</label>
                            </td>
                            <td>
                                <input type="radio" id="4" name="User">
                                <label for="4">Other</label>
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td colspan="2">
                                <input type="radio" id="5" name="User">
                                <label for="5">Government</label>
                            </td>
                        </tr>
                        <tr>
                            <td valign="top" style="padding-top: 3px">
                                <label>System (check all that apply):</label>
                            </td>
                            <td>
                                <input type="checkbox" id="01" name="System">
                                <label for="01">Windows</label>
                            </td>
                            <td>
                                <input type="checkbox" id="02" name="System">
                                <label for="02">UNIX</label>
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="checkbox" id="03" name="System">
                                <label for="03">Macintosh</label>
                            </td>
                            <td>
                                <input type="checkbox" id="04" name="System">
                                <label for="04">Other</label>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="3"><hr style="border: none; border-top: 1px solid black; width:95%; margin-left:0;"></td>
                        </tr>
                        <tr>
                            <td valign="top"><label>Comments?:</label></td>
                            <td colspan="2"><textarea></textarea></td>
                        </tr>
                        <tr>
                            <td colspan="3" style="padding-bottom:0; padding-top:0"; align="center">
                                <input type="submit" value="Click to register" class="nut">
                                <input type="reset" value="Click to cancel" class="nut">
                            </td>
                        </tr>
                    </table>
                </form>
                </td>
            </tr>
        </table>
    </body>
</html>
